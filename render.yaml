services:
  - type: web
    name: mansa-dashboard
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: TABBLY_API_KEY
        sync: false
      - key: TABBLY_ORG_ID
        sync: false
      - key: TABBLY_CALL_FROM_NUMBER
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: PORT
        value: 8000
